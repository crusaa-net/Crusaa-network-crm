<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Equipo | Crusaa Network CRM</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 700px;
      margin: 25px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 14px;
      box-shadow: 0 3px 12px rgba(0,0,0,.10);
      margin-bottom: 20px;
    }

    h1, h2 {
      margin-top: 0;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 15px;
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .miembro {
      border-bottom: 1px solid #ddd;
      padding: 14px 0;
    }

    .miembro:last-child {
      border-bottom: none;
    }

    .rol {
      display: inline-block;
      margin-top: 5px;
      padding: 5px 10px;
      background: #e5e7eb;
      border-radius: 20px;
      font-size: 13px;
    }

    .vacio {
      color: #777;
    }

    .volver {
      display: inline-block;
      margin-bottom: 15px;
      text-decoration: none;
      color: #111827;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <h1>Mi Equipo</h1>
  <p>Crusaa Network CRM</p>
</header>

<div class="container">

  <a class="volver" href="index.html">← Volver al CRM</a>

  <div class="card">
    <h2>Agregar miembro</h2>

    <form id="formEquipo">

      <label for="nombre">Nombre completo</label>
      <input
        type="text"
        id="nombre"
        placeholder="Nombre del miembro"
        required
      >

      <label for="telefono">Teléfono</label>
      <input
        type="tel"
        id="telefono"
        placeholder="Número de teléfono"
      >

      <label for="rol">Rol</label>
      <select id="rol" required>
        <option value="">Selecciona un rol</option>
        <option value="Telemarketing">Telemarketing</option>
        <option value="Vendedor/Demostrador">
          Vendedor/Demostrador
        </option>
        <option value="Telemarketing + Vendedor/Demostrador">
          Ambos
        </option>
      </select>

      <button type="submit">Agregar al equipo</button>

    </form>
  </div>

  <div class="card">
    <h2>Miembros del equipo</h2>
    <div id="listaEquipo"></div>
  </div>

</div>

<script>
  const form = document.getElementById("formEquipo");
  const lista = document.getElementById("listaEquipo");

  let equipo = JSON.parse(localStorage.getItem("equipoCRM")) || [];

  function guardarEquipo() {
    localStorage.setItem("equipoCRM", JSON.stringify(equipo));
  }

  function mostrarEquipo() {

    lista.innerHTML = "";

    if (equipo.length === 0) {
      lista.innerHTML =
        '<p class="vacio">Todavía no has agregado miembros.</p>';
      return;
    }

    equipo.forEach(function(miembro) {

      const div = document.createElement("div");
      div.className = "miembro";

      const nombre = document.createElement("strong");
      nombre.textContent = miembro.nombre;

      const telefono = document.createElement("div");
      telefono.textContent =
        miembro.telefono ? miembro.telefono : "Sin teléfono";

      const rol = document.createElement("span");
      rol.className = "rol";
      rol.textContent = miembro.rol;

      div.appendChild(nombre);
      div.appendChild(telefono);
      div.appendChild(rol);

      lista.appendChild(div);
    });
  }

  form.addEventListener("submit", function(event) {

    event.preventDefault();

    const nombre = document.getElementById("nombre").value.trim();
    const telefono = document.getElementById("telefono").value.trim();
    const rol = document.getElementById("rol").value;

    if (!nombre || !rol) {
      return;
    }

    equipo.push({
      nombre: nombre,
      telefono: telefono,
      rol: rol
    });

    guardarEquipo();
    mostrarEquipo();

    form.reset();
  });

  mostrarEquipo();
</script>

</body>
</html>
