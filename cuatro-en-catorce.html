<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Programa 4 en 14</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #061426;
      color: white;
      font-family: Arial, sans-serif;
    }

    .contenedor {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    .encabezado {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 20px;
    }

    .volver {
      color: white;
      text-decoration: none;
      font-size: 34px;
    }

    .titulo {
      margin: 0;
      font-size: 28px;
    }
        .panel {
      background: #fff8e8;
      color: #08203d;
      border: 2px solid #d6ad54;
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .logo-programa {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo-programa .personas {
      font-size: 55px;
    }

    .logo-programa h2 {
      font-size: 48px;
      margin: 5px 0;
      color: #082f63;
    }

    .logo-programa p {
      margin: 0;
      font-weight: bold;
      color: #36516f;
    }

    .mensaje {
      text-align: center;
      margin: 25px 0;
      font-size: 20px;
      font-weight: bold;
      color: #123c73;
    }
        .formulario {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .formulario input,
    .formulario select,
    .formulario textarea {
      width: 100%;
      padding: 15px;
      border: 2px solid #d5dce5;
      border-radius: 14px;
      font-size: 17px;
      background: white;
      color: #08203d;
    }

    .formulario textarea {
      min-height: 80px;
      resize: vertical;
    }

    .guardar {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(#f5c65b, #c88a22);
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }
        .lista {
      margin-top: 25px;
      background: #08203d;
      border-radius: 20px;
      padding: 18px;
    }

    .lista h3 {
      margin-top: 0;
      font-size: 22px;
      color: white;
    }

    .referido {
    background: #f8f1df;
    color: #08203d;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 10px;
}

    .referido strong {
      font-size: 18px;
    }

    .estado {
      display: inline-block;
      margin-top: 8px;
      padding: 8px 14px;
      border-radius: 10px;
      background: #f5c65b;
      color: #08203d;
      font-weight: bold;
    }
    .estado-pendiente {
  background: #f5c65b;
}

.estado-contactado {
  background: #4da3ff;
}

.estado-cita {
  background: #b58cff;
}

.estado-demostracion {
  background: #5fcf80;
}

.estado-venta {
  background: #ffd700;
}
    .referido button {
  margin: 6px 5px;
  padding: 8px 14px;
  border: none;
  border-radius: 10px;
  background: #08203d;
  color: white;
  font-weight: bold;
  cursor: pointer;
    }
    .modal-estado {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.65);
  z-index: 9999;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal-contenido {
  background: #fff7e5;
  padding: 25px;
  border-radius: 20px;
  width: 100%;
  max-width: 360px;
  text-align: center;
}

.modal-contenido h2 {
  color: #08203d;
  margin-top: 0;
  margin-bottom: 20px;
}

.modal-contenido button {
  display: block;
  width: 100%;
  margin: 10px 0;
  padding: 14px;
  border: none;
  border-radius: 10px;
  background: #08203d;
  color: white;
  font-size: 18px;
  font-weight: bold;
}
      </style>
</head>

<body>

  <div class="contenedor">

    <div class="encabezado">
      <a class="volver" href="crm.html">←</a>
      <h1 class="titulo">Programa 4 en 14</h1>
    </div>

    <div class="panel">

      <div class="logo-programa">
        <div class="personas">👥</div>
        <h2>4 en 14</h2>
        <p>Juntos multiplicamos beneficios</p>
      </div>

      <div class="mensaje">
        TU AYUDA HACE LA DIFERENCIA<br>
        4 demostraciones en 14 días
      </div>
            <div class="formulario">
<select id="clientePrograma">
  <option value="">Cliente del programa 4 en 14</option>
</select>
        <input
          type="text"
          id="nombreReferido"
          placeholder="Nombre del referido">

        <input
          type="tel"
          id="telefonoReferido"
          placeholder="Teléfono">

        <select id="relacionReferido">
          <option value="">Relación (Familiar, Amigo, Vecino, etc.)</option>
          <option>Familiar</option>
          <option>Amigo</option>
          <option>Vecino</option>
          <option>Compañero de trabajo</option>
          <option>Otro</option>
        </select>

        <textarea
          id="notasReferido"
          placeholder="Notas (opcional)"></textarea>

        <button class="guardar" onclick="guardarReferido()">
          Guardar Referido
        </button>

            </div>
            <div class="lista">
<h3>Referidos: <span id="totalReferidos">0</span></h3>
              <h3>Demostraciones: <span id="totalDemostraciones">0</span> / 4</h3>
 <h3>Ventas: <span id="totalVentas">0</span> / 4</h3>
              <div id="listaReferidos"></div>
              <div id="modalEstado" class="modal-estado">
  <div class="modal-contenido">
    <h2>Selecciona el nuevo estado</h2>

    <button onclick="seleccionarEstado('Pendiente')">🟡 Pendiente</button>
    <button onclick="seleccionarEstado('Contactado')">🔵 Contactado</button>
    <button onclick="seleccionarEstado('Cita')">📅 Cita</button>
    <button onclick="seleccionarEstado('Demostración')">🏠 Demostración</button>
    <button onclick="seleccionarEstado('Venta')">💰 Venta</button>

    <button onclick="cerrarModalEstado()">Cancelar</button>
  </div>
            
            </div>
            <script>
         const clientes =
  JSON.parse(localStorage.getItem("clientesCRUSAA")) || [];

const clientePrograma =
  document.getElementById("clientePrograma");

clientes.forEach(function(cliente) {
  const opcion = document.createElement("option");
  opcion.value = cliente.nombre;
  opcion.textContent = cliente.nombre;
  clientePrograma.appendChild(opcion);
});
              clientePrograma.addEventListener("change", mostrarReferidos);
              let referidos = JSON.parse(
  localStorage.getItem("referidos4en14")
) || [];
              function guardarReferido() {
                const cliente =
  document.getElementById("clientePrograma").value;
  const nombre = document.getElementById("nombreReferido").value.trim();
  const telefono = document.getElementById("telefonoReferido").value.trim();
  const relacion = document.getElementById("relacionReferido").value;
  const notas = document.getElementById("notasReferido").value.trim();
    if (cliente === "") {
  alert("Selecciona el cliente del programa 4 en 14.");
  return;
    }            
                if (nombre === "" || telefono === "") {
  alert("Escribe el nombre y teléfono del referido.");
  return;
                }
                referidos.push({
  cliente: cliente,
  nombre: nombre,
  telefono: telefono,
  relacion: relacion,
  notas: notas,
  estado: "Pendiente"
});

localStorage.setItem(
  "referidos4en14",
  JSON.stringify(referidos)
);
                document.getElementById("nombreReferido").value = "";
document.getElementById("telefonoReferido").value = "";
document.getElementById("relacionReferido").value = "";
document.getElementById("notasReferido").value = "";

mostrarReferidos();
              }
function mostrarReferidos() {
  const lista = document.getElementById("listaReferidos");
 const clientes =
  JSON.parse(localStorage.getItem("clientesCRUSAA")) || [];
  const total = document.getElementById("totalReferidos");

  const referidosDelCliente = clientePrograma.value === ""
  ? referidos
  : referidos.filter(function(referido) {
      return referido.cliente === clientePrograma.value;
    });

total.textContent = referidosDelCliente.length;
  const totalDemostraciones =
  referidosDelCliente.filter(function(referido) {
    return referido.estado === "Demostración";
  }).length;

document.getElementById("totalDemostraciones").textContent =
  totalDemostraciones;
  const totalVentas =
  referidosDelCliente.filter(function(referido) {
    return referido.estado === "Venta";
  }).length;

document.getElementById("totalVentas").textContent =
  totalVentas;
  lista.innerHTML = "";
if (clientePrograma.value !== "") {
  const clienteSeleccionado =
    clientes.find(function(cliente) {
      return (cliente.nombre || "").trim().toLowerCase() ===
        clientePrograma.value.trim().toLowerCase();
    });

  if (clienteSeleccionado && clienteSeleccionado.foto) {
    const fotoPrincipal = document.createElement("img");
    fotoPrincipal.src = clienteSeleccionado.foto;
    fotoPrincipal.style.width = "90px";
    fotoPrincipal.style.height = "90px";
    fotoPrincipal.style.borderRadius = "50%";
    fotoPrincipal.style.objectFit = "cover";
    fotoPrincipal.style.display = "block";
    fotoPrincipal.style.margin = "0 auto 20px auto";

    lista.appendChild(fotoPrincipal);
  }
}
  referidos.forEach((referido, index) => {
  if (clientePrograma.value !== "" &&
    referido.cliente !== clientePrograma.value) {
  return;
  }
    const tarjeta = document.createElement("div");
    tarjeta.className = "referido";

    tarjeta.innerHTML =
      "<strong>" + referido.nombre + "</strong><br>" +
      "👤 Referido por: " + (referido.cliente || "Sin especificar") + "<br>" +
      "📞 " + referido.telefono + "<br>" +
      "Relación: " + (referido.relacion || "Sin especificar") + "<br>" +
      (referido.notas ? "📝 " + referido.notas + "<br>" : "") +
    '<span class="estado estado-' +
referido.estado.toLowerCase().replace("ó", "o") + '">' +
      referido.estado + "</span>";
    
const botonEstado = document.createElement("button");
botonEstado.textContent = "Cambiar estado";

botonEstado.onclick = function () {
  cambiarEstado(index);
};

tarjeta.appendChild(botonEstado);
    const botonEditar = document.createElement("button");
botonEditar.textContent = "✏️ Editar";

botonEditar.onclick = function () {
  editarReferido(index);
};

tarjeta.appendChild(botonEditar);
   const botonEliminar = document.createElement("button");
botonEliminar.textContent = "🗑️ Eliminar";

botonEliminar.onclick = function () {
  eliminarReferido(index);
};

tarjeta.appendChild(botonEliminar); 
    lista.appendChild(tarjeta);
  });
}
let referidoEstadoIndex = null;

function cambiarEstado(index) {
  referidoEstadoIndex = index;
  document.getElementById("modalEstado").style.display = "flex";
}

function seleccionarEstado(nuevoEstado) {
  if (
  nuevoEstado === "Cita" ||
  nuevoEstado === "Demostración"
) {
  const selectorFecha = document.createElement("input");
selectorFecha.type = "date";

selectorFecha.style.position = "fixed";
selectorFecha.style.opacity = "0";
selectorFecha.style.pointerEvents = "none";

document.body.appendChild(selectorFecha);

selectorFecha.addEventListener("change", function () {
  const fecha = selectorFecha.value;

  if (!fecha) {
    selectorFecha.remove();
    return;
  }

  referidos[referidoEstadoIndex].fecha = fecha;

  selectorFecha.remove();
});

selectorFecha.showPicker();   
}
  referidos[referidoEstadoIndex].estado = nuevoEstado;

  localStorage.setItem(
    "referidos4en14",
    JSON.stringify(referidos)
  );

  cerrarModalEstado();
  mostrarReferidos();
}

function cerrarModalEstado() {
  document.getElementById("modalEstado").style.display = "none";
  referidoEstadoIndex = null;
}
              function editarReferido(index) {
  const referido = referidos[index];

  const nombre = prompt("Nombre del referido:", referido.nombre);
  if (nombre === null) return;

  const telefono = prompt("Teléfono:", referido.telefono);
  if (telefono === null) return;

  const relacion = prompt("Relación:", referido.relacion);
  if (relacion === null) return;

  const notas = prompt("Notas:", referido.notas || "");
  if (notas === null) return;

  referidos[index].nombre = nombre.trim();
  referidos[index].telefono = telefono.trim();
  referidos[index].relacion = relacion.trim();
  referidos[index].notas = notas.trim();

  localStorage.setItem(
    "referidos4en14",
    JSON.stringify(referidos)
  );

  mostrarReferidos();
              }
              function eliminarReferido(index) {
  if (!confirm("¿Eliminar este referido?")) {
    return;
  }

  referidos.splice(index, 1);

  localStorage.setItem(
    "referidos4en14",
    JSON.stringify(referidos)
  );

  mostrarReferidos();
              }
mostrarReferidos();

</script>
</div>
</body>
    </html>
