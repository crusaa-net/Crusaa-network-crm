<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes | CRUSAA Network</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      min-height: 100vh;
    }

    header {
      background: #1e293b;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 22px;
    }

    .volver {
      background: #334155;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    .container {
      padding: 25px 20px;
      max-width: 900px;
      margin: auto;
    }

    h2 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .subtitulo {
      color: #94a3b8;
      margin-bottom: 25px;
    }

    .formulario {
      background: #1e293b;
      padding: 22px;
      border-radius: 18px;
      margin-bottom: 25px;
    }

    input, textarea {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid #475569;
      border-radius: 10px;
      background: #0f172a;
      color: white;
      font-size: 16px;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    .guardar {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .cliente {
      background: #1e293b;
      padding: 18px;
      border-radius: 15px;
      margin-bottom: 12px;
    }

    .cliente h3 {
      margin-bottom: 8px;
    }

    .cliente p {
      color: #cbd5e1;
      margin-bottom: 5px;
    }

    .eliminar {
      margin-top: 12px;
      padding: 8px 12px;
      border: none;
      border-radius: 8px;
      background: #ef4444;
      color: white;
      cursor: pointer;
    }

    .vacio {
      color: #94a3b8;
      text-align: center;
      padding: 25px;
    }
  </style>
</head>

<body>

<header>
  <h1>CRUSAA Network</h1>
  <button class="volver" onclick="window.location.href='crm.html'">
    ← Volver
  </button>
</header>

<main class="container">

  <h2>👥 Clientes</h2>
  <p class="subtitulo">
    Administra tus clientes, contactos y prospectos.
  </p>

  <div class="formulario">

    <input
      id="nombre"
      type="text"
      placeholder="Nombre del cliente"
    >

    <input
      id="telefono"
      type="tel"
      placeholder="Teléfono"
    >

    <input
      id="email"
      type="email"
      placeholder="Correo electrónico"
    >

    <textarea
      id="notas"
      placeholder="Notas del cliente"
    ></textarea>

    <button class="guardar" onclick="guardarCliente()">
      + Guardar cliente
    </button>

  </div>

  <div id="listaClientes"></div>

</main>

<script>

  let clientes =
    JSON.parse(localStorage.getItem("clientesCRUSAA")) || [];

  function guardarCliente() {

    const nombre =
      document.getElementById("nombre").value.trim();

    const telefono =
      document.getElementById("telefono").value.trim();

    const email =
      document.getElementById("email").value.trim();

    const notas =
      document.getElementById("notas").value.trim();

    if (!nombre) {
      alert("Escribe el nombre del cliente.");
      return;
    }

    clientes.push({
      nombre,
      telefono,
      email,
      notas
    });

    localStorage.setItem(
      "clientesCRUSAA",
      JSON.stringify(clientes)
    );

    document.getElementById("nombre").value = "";
    document.getElementById("telefono").value = "";
    document.getElementById("email").value = "";
    document.getElementById("notas").value = "";

    mostrarClientes();
  }

  function eliminarCliente(index) {

    if (!confirm("¿Eliminar este cliente?")) {
      return;
    }

    clientes.splice(index, 1);

    localStorage.setItem(
      "clientesCRUSAA",
      JSON.stringify(clientes)
    );

    mostrarClientes();
  }

  function mostrarClientes() {

    const lista =
      document.getElementById("listaClientes");

    if (clientes.length === 0) {

      lista.innerHTML =
        '<div class="vacio">Todavía no tienes clientes registrados.</div>';

      return;
    }

    lista.innerHTML = "";

    clientes.forEach((cliente, index) => {

      const tarjeta = document.createElement("div");
      tarjeta.className = "cliente";

      const nombre = document.createElement("h3");
      nombre.textContent = cliente.nombre;
      tarjeta.appendChild(nombre);

      if (cliente.telefono) {
        const telefono = document.createElement("p");
        telefono.textContent = "📞 " + cliente.telefono;
        tarjeta.appendChild(telefono);
      }

      if (cliente.email) {
        const email = document.createElement("p");
        email.textContent = "✉️ " + cliente.email;
        tarjeta.appendChild(email);
      }

      if (cliente.notas) {
        const notas = document.createElement("p");
        notas.textContent = "📝 " + cliente.notas;
        tarjeta.appendChild(notas);
      }
const editar = document.createElement("button");
editar.textContent = "✏️ Editar";
editar.onclick = function () {
  editarCliente(index);
};

tarjeta.appendChild(editar);
      const boton = document.createElement("button");
      boton.className = "eliminar";
      boton.textContent = "Eliminar";
      boton.onclick = function () {
        eliminarCliente(index);
      };

      tarjeta.appendChild(boton);
      lista.appendChild(tarjeta);

    });
  }
function editarCliente(index) {
  const clientes = JSON.parse(localStorage.getItem("clientesCRUSAA")) || [];
  const cliente = clientes[index];

  const nombre = prompt("Nombre del cliente:", cliente.nombre);
  if (nombre === null) return;

  const telefono = prompt("Teléfono:", cliente.telefono);
  if (telefono === null) return;

  const correo = prompt("Correo electrónico:", cliente.correo);
  if (correo === null) return;

  const notas = prompt("Notas:", cliente.notas);
  if (notas === null) return;

  clientes[index] = {
    nombre: nombre,
    telefono: telefono,
    correo: correo,
    notas: notas
  };

  localStorage.setItem("clientesCRUSAA", JSON.stringify(clientes));
  mostrarClientes();
}
  mostrarClientes();

</script>

</body>
</html>
