<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ficha del Referido</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #07162b;
      color: white;
    }

    .volver {
      display: inline-block;
      margin-bottom: 20px;
      color: white;
      text-decoration: none;
      font-size: 18px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 25px;
    }

    .ficha {
      background: #192d47;
      border-radius: 22px;
      padding: 22px;
    }

    .dato {
      margin-bottom: 18px;
    }

    .etiqueta {
      color: #aeb8c8;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .valor {
      font-size: 19px;
      word-break: break-word;
    }

    button {
      width: 100%;
      padding: 17px;
      margin-top: 20px;
      border: none;
      border-radius: 14px;
      background: #2474e8;
      color: white;
      font-size: 19px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <a class="volver" href="referidos.html">
    ← Volver
  </a>

  <h1>👤 Ficha del Referido</h1>

  <div class="ficha" id="fichaReferido">
    Cargando información...
  </div>

  <script>
    const telefonoReferido =
  new URLSearchParams(window.location.search).get("telefono");

let referidos =
  JSON.parse(localStorage.getItem("referidosCRUSAA")) || [];

let referido = referidos.find(
  r => r.telefono === telefonoReferido
);

const ficha =
  document.getElementById("fichaReferido");

if (!referido) {
  ficha.innerHTML =
    "<p>No se encontró el referido.</p>";
} else {

  ficha.innerHTML =
    '<div class="dato">' +
      '<div class="etiqueta">Nombre</div>' +
      '<div class="valor">' +
        (referido.nombre || "") + " " +
        (referido.apellido || "") +
      '</div>' +
    '</div>' +

    '<div class="dato">' +
      '<div class="etiqueta">Teléfono</div>' +
      '<div class="valor">' +
        (referido.telefono || "") +
      '</div>' +
    '</div>' +

    '<div class="dato">' +
      '<div class="etiqueta">Correo electrónico</div>' +
      '<div class="valor">' +
        (referido.email || "Sin información") +
      '</div>' +
    '</div>' +

    '<div class="dato">' +
      '<div class="etiqueta">Dirección</div>' +
      '<div class="valor">' +
        (referido.direccion || "Sin información") +
      '</div>' +
    '</div>' +

    '<div class="dato">' +
      '<div class="etiqueta">Ciudad</div>' +
      '<div class="valor">' +
        (referido.ciudad || "Sin información") +
      '</div>' +
    '</div>' +

    '<div class="dato">' +
      '<div class="etiqueta">Estado</div>' +
      '<div class="valor">' +
        (referido.estado || "Sin información") +
      '</div>' +
    '</div>' +

    '<div class="dato">' +
      '<div class="etiqueta">Código postal</div>' +
      '<div class="valor">' +
        (referido.codigoPostal || "Sin información") +
      '</div>' +
    '</div>' +

    '<div class="dato">' +
      '<div class="etiqueta">Relación</div>' +
      '<div class="valor">' +
        (referido.relacion || "Sin información") +
      '</div>' +
    '</div>' +

    '<div class="dato">' +
      '<div class="etiqueta">Mejor horario para llamar</div>' +
      '<div class="valor">' +
        (referido.horario || "Sin información") +
      '</div>' +
    '</div>' +

    '<div class="dato">' +
      '<div class="etiqueta">Comentarios</div>' +
      '<div class="valor">' +
        (referido.comentarios || "Sin información") +
      '</div>' +
    '</div>' +

    '<div class="dato">' +
      '<div class="etiqueta">Referido por</div>' +
      '<div class="valor">' +
        (referido.clienteOrigen || "Sin información") +
      '</div>' +
    '</div>' +

    '<button onclick="editarReferido()">✏️ Editar referido</button>';
}
    function editarReferido() {
  const nombre = prompt("Nombre:", referido.nombre || "");
  if (nombre === null) return;

  const apellido = prompt("Apellido:", referido.apellido || "");
  if (apellido === null) return;

  const telefono = prompt("Teléfono:", referido.telefono || "");
  if (telefono === null) return;

  const email = prompt("Correo electrónico:", referido.email || "");
  if (email === null) return;

  const direccion = prompt("Dirección:", referido.direccion || "");
  if (direccion === null) return;

  const ciudad = prompt("Ciudad:", referido.ciudad || "");
  if (ciudad === null) return;

  const estado = prompt("Estado:", referido.estado || "");
  if (estado === null) return;

  const codigoPostal = prompt(
    "Código postal:",
    referido.codigoPostal || ""
  );
  if (codigoPostal === null) return;

  const relacion = prompt("Relación:", referido.relacion || "");
  if (relacion === null) return;

  const horario = prompt(
    "Mejor horario:",
    referido.horario || ""
  );
  if (horario === null) return;

  const comentarios = prompt(
    "Comentarios:",
    referido.comentarios || ""
  );
  if (comentarios === null) return;

  referido.nombre = nombre.trim();
  referido.apellido = apellido.trim();
  referido.telefono = telefono.trim();
  referido.email = email.trim();
  referido.direccion = direccion.trim();
  referido.ciudad = ciudad.trim();
  referido.estado = estado.trim();
  referido.codigoPostal = codigoPostal.trim();
  referido.relacion = relacion.trim();
  referido.horario = horario.trim();
  referido.comentarios = comentarios.trim();

  localStorage.setItem(
    "referidosCRUSAA",
    JSON.stringify(referidos)
  );

  location.reload();
    }
  </script>

</body>
</html>
