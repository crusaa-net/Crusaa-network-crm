<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ventas - CRUSAA Network</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #06182b;
      color: white;
    }

    .contenedor {
      max-width: 700px;
      margin: auto;
      padding: 24px 18px;
    }

    .encabezado {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 25px;
    }

    .volver {
      font-size: 30px;
      cursor: pointer;
    }

    h1 {
      margin: 0;
      font-size: 34px;
    }

    .nueva-venta {
      background: #e3a927;
      color: #08203d;
      border: none;
      border-radius: 12px;
      padding: 12px 15px;
      font-weight: bold;
      font-size: 16px;
    }

    .filtros {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 18px;
    }

    .filtro {
      padding: 14px 5px;
      border: 1px solid #1688c9;
      border-radius: 12px;
      background: #0a3555;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    .filtro.activo {
      background: #29a9ef;
      color: #06203b;
    }

    .buscador {
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      border: 2px solid #1688c9;
      background: #092b45;
      color: white;
      font-size: 18px;
      outline: none;
      margin-bottom: 20px;
    }

    .buscador::placeholder {
      color: #c8d3df;
    }
    .barra-inferior {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  background: #06182b;
  border-top: 1px solid #1688c9;
  padding: 10px 0;
  text-align: center;
}

.boton-inicio {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  color: white;
  text-decoration: none;
  font-family: Arial, sans-serif;
  font-weight: bold;
  font-size: 16px;
}

.icono-inicio {
  font-size: 30px;
  line-height: 32px;
}
  </style>
</head>

<body>

  <div class="contenedor">

    <div class="encabezado">
      <span class="volver" onclick="history.back()">←</span>

      <h1>Ventas</h1>

      <button class="nueva-venta" onclick="nuevaVenta()">
        + Nueva
      </button>
    </div>

    <div class="filtros">
      <button class="filtro activo">Todas</button>
      <button class="filtro">Pagadas</button>
      <button class="filtro">Pendientes</button>
    </div>

    <input
      class="buscador"
      type="text"
      placeholder="🔍 Buscar ventas..."
    >
<div id="listaVentas"></div>
  </div>
<div class="barra-inferior">
  <a href="crm.html" class="boton-inicio">
    <span class="icono-inicio">🏠</span>
    <span>Inicio</span>
  </a>
</div>
<script>
function nuevaVenta() {
  const nombre = prompt("Nombre del cliente:");
  if (nombre === null || nombre.trim() === "") return;

  const producto = prompt("Producto vendido:");
  if (producto === null) return;

  const monto = prompt("Monto de la venta:");
  if (monto === null) return;
const lista = document.getElementById("listaVentas");

const venta = document.createElement("div");
venta.innerHTML =
  "<strong>" + nombre + "</strong><br>" +
  "Producto: " + producto + "<br>" +
  "Monto: $" + monto;
const ventas =
  JSON.parse(localStorage.getItem("ventasCRUSAA")) || [];

ventas.push({
  nombre: nombre,
  producto: producto,
  monto: monto
});

localStorage.setItem(
  "ventasCRUSAA",
  JSON.stringify(ventas)
);
lista.appendChild(venta);
  
}
  function mostrarVentasGuardadas() {
  const ventas =
    JSON.parse(localStorage.getItem("ventasCRUSAA")) || [];

  const lista =
    document.getElementById("listaVentas");

  ventas.forEach(function(datos) {
    const venta = document.createElement("div");

    venta.innerHTML =
      "<strong>" + datos.nombre + "</strong><br>" +
      "Producto: " + datos.producto + "<br>" +
      "Monto: $" + datos.monto;

    lista.appendChild(venta);
  });
}

mostrarVentasGuardadas();
</script>
</body>
</html>
