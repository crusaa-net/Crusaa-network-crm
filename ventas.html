<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ventas - CRUSAA Network</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #06182b;
      color: white;
    }

    .contenedor {
      max-width: 700px;
      margin: auto;
      padding: 24px 18px;
    }

    .encabezado {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 25px;
    }

    .volver {
      font-size: 30px;
      cursor: pointer;
    }

    h1 {
      margin: 0;
      font-size: 34px;
    }

    .nueva-venta {
      background: #e3a927;
      color: #08203d;
      border: none;
      border-radius: 12px;
      padding: 12px 15px;
      font-weight: bold;
      font-size: 16px;
    }

    .filtros {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 18px;
    }

    .filtro {
      padding: 14px 5px;
      border: 1px solid #1688c9;
      border-radius: 12px;
      background: #0a3555;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    .filtro.activo {
      background: #29a9ef;
      color: #06203b;
    }

    .buscador {
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      border: 2px solid #1688c9;
      background: #092b45;
      color: white;
      font-size: 18px;
      outline: none;
      margin-bottom: 20px;
    }

    .buscador::placeholder {
      color: #c8d3df;
    }
    .barra-inferior {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  background: #06182b;
  border-top: 1px solid #1688c9;
  padding: 10px 0;
  text-align: center;
}
#listaVentas {
  padding-bottom: 120px;
}
    
.boton-inicio {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  color: white;
  text-decoration: none;
  font-family: Arial, sans-serif;
  font-weight: bold;
  font-size: 16px;
}

.icono-inicio {
  font-size: 30px;
  line-height: 32px;
}
    #listaVentas button {
  margin: 6px 4px;
  padding: 8px 12px;
  border-radius: 8px;
    }
  </style>
</head>

<body>

  <div class="contenedor">

    <div class="encabezado">
      <span class="volver" onclick="history.back()">←</span>

      <h1>Ventas</h1>

      <button class="nueva-venta" onclick="nuevaVenta()">
        + Nueva
      </button>
    </div>

    <div class="filtros">
      <button class="filtro"
onclick="filtrarVentasConBusqueda('Todas')">Todas</button>

<button class="filtro"
onclick="filtrarVentasConBusqueda('Pagada')">Pagadas</button>

<button class="filtro"
onclick="filtrarVentasConBusqueda('Pendiente')">Pendientes</button>
    </div>

    <input id="buscadorVentas"
      class="buscador"
      type="text"
      oninput="buscarVentas(this.value)"
      placeholder="🔍 Buscar ventas..."
    >
<div id="listaVentas"></div>
  </div>
<div class="barra-inferior">
  <a href="crm.html" class="boton-inicio">
    <span class="icono-inicio">🏠</span>
    <span>Inicio</span>
  </a>
</div>
<script>
function nuevaVenta() {
  const nombre = prompt("Nombre del cliente:");
  if (nombre === null || nombre.trim() === "") return;

  const producto = prompt("Producto vendido:");
  if (producto === null) return;

  const monto = prompt("Monto de la venta:");
  if (monto === null) return;
  const estadoIngresado = prompt("Estado de la venta: Pagada o Pendiente");
if (estadoIngresado === null) return;

const estado =
  estadoIngresado.trim().toLowerCase().startsWith("paga")
    ? "Pagada"
    : "Pendiente";
const lista = document.getElementById("listaVentas");

const venta = document.createElement("div");
venta.innerHTML =
  "<strong>" + nombre + "</strong><br>" +
  "Producto: " + producto + "<br>" +
  "Monto: $" + monto + "<br>" +
"Estado: " + estado;
const ventas =
  JSON.parse(localStorage.getItem("ventasCRUSAA")) || [];

ventas.push({
  nombre: nombre,
  producto: producto,
  monto: monto,
estado: estado
});

localStorage.setItem(
  "ventasCRUSAA",
  JSON.stringify(ventas)
);
mostrarVentasGuardadas();
  
}
  function mostrarVentasGuardadas() {
  const ventas =
   JSON.parse(localStorage.getItem("ventasCRUSAA")) || [];

    const lista =
  document.getElementById("listaVentas");
lista.innerHTML = "";
  ventas.forEach(function(datos) {
    const estadoTexto = (datos.estado || "").trim().toLowerCase();

const estadoNormalizado =
  estadoTexto.startsWith("paga")
    ? "Pagada"
    : estadoTexto.startsWith("pend")
      ? "Pendiente"
      : "Sin estado";
    const venta = document.createElement("div");

    venta.innerHTML =
      "<strong>" + datos.nombre + "</strong><br>" +
      "Producto: " + datos.producto + "<br>" +
      "Monto: $" + datos.monto + "<br>" +
"Estado: " + estadoNormalizado + "<br>";
    const botonEditar = document.createElement("button");
botonEditar.textContent = "✏️ Editar";

botonEditar.onclick = function () {
  editarVenta(datos);
};

venta.appendChild(botonEditar);
    const botonEliminar =
  document.createElement("button");

botonEliminar.textContent = "🗑️ Eliminar";

botonEliminar.onclick = function () {
  eliminarVenta(datos);
};

venta.appendChild(botonEliminar);
    lista.appendChild(venta);
  });
}
function editarVenta(datos) {
  const nombreOriginal = datos.nombre;
const productoOriginal = datos.producto;
const montoOriginal = datos.monto;
const nuevoNombre = prompt(
  "Nombre del cliente:",
  datos.nombre
);

if (nuevoNombre === null) return;
  const nuevoProducto = prompt(
  "Producto vendido:",
  datos.producto
);

if (nuevoProducto === null) return;
  const nuevoMonto = prompt(
  "Monto de la venta:",
  datos.monto
);

if (nuevoMonto === null) return;
  const nuevoEstado = prompt(
  "Estado: Pagada o Pendiente",
  datos.estado
);

if (nuevoEstado === null) return;
  datos.nombre = nuevoNombre.trim();
datos.producto = nuevoProducto.trim();
datos.monto = nuevoMonto.trim();

datos.estado =
  nuevoEstado.trim().toLowerCase().startsWith("paga")
    ? "Pagada"
    : "Pendiente";
  const ventas =
  JSON.parse(localStorage.getItem("ventasCRUSAA")) || [];

const indice = ventas.findIndex(function (venta) {
  return venta.nombre === nombreOriginal &&
       venta.producto === productoOriginal &&
       venta.monto === montoOriginal;
});
  if (indice !== -1) {
  ventas[indice] = datos;

  localStorage.setItem(
    "ventasCRUSAA",
    JSON.stringify(ventas)
  );

  mostrarVentasGuardadas();
  }
}
 function eliminarVenta(datos) {
  if (!confirm("¿Eliminar esta venta?")) {
    return;
  }

  const ventas =
    JSON.parse(localStorage.getItem("ventasCRUSAA")) || [];

  const indice = ventas.findIndex(function (venta) {
    return venta.nombre === datos.nombre &&
      venta.producto === datos.producto &&
      venta.monto === datos.monto;
  });

  if (indice !== -1) {
    ventas.splice(indice, 1);

    localStorage.setItem(
      "ventasCRUSAA",
      JSON.stringify(ventas)
    );

    mostrarVentasGuardadas();
  }
 } 
  function filtrarVentasConBusqueda(estado) {
  const buscador = document.getElementById("buscadorVentas");
  const texto = buscador.value.trim();

  if (texto !== "") {
    buscarVentas(texto, estado);
  } else if (estado === "Todas") {
    mostrarVentasGuardadas();
  } else {
    filtrarVentas(estado);
  }
  }
function filtrarVentas(estado) {
  const ventas =
    JSON.parse(localStorage.getItem("ventasCRUSAA")) || [];

  const lista =
    document.getElementById("listaVentas");

  lista.innerHTML = "";

  ventas
    .filter(function(datos) {
      return (datos.estado || "").toLowerCase().startsWith(estado.toLowerCase());
    })
    .forEach(function(datos) {
      const venta = document.createElement("div");

      venta.innerHTML =
        "<strong>" + datos.nombre + "</strong><br>" +
        "Producto: " + datos.producto + "<br>" +
        "Monto: $" + datos.monto + "<br>" +
"Estado: " + (estado.toLowerCase().startsWith("paga") ? "Pagada" : "Pendiente");

      const botonEditar = document.createElement("button");
botonEditar.textContent = "✏️ Editar";

botonEditar.onclick = function () {
  editarVenta(datos);
};

venta.appendChild(botonEditar);
      const botonEliminar =
  document.createElement("button");

botonEliminar.textContent = "🗑️ Eliminar";

botonEliminar.onclick = function () {
  eliminarVenta(datos);
};

venta.appendChild(botonEliminar);
      lista.appendChild(venta);
    });
}
  function buscarVentas(texto, estado = "Todas") {
  const ventas =
    JSON.parse(localStorage.getItem("ventasCRUSAA")) || [];

  const lista =
    document.getElementById("listaVentas");

  lista.innerHTML = "";

  const busqueda = texto.trim().toLowerCase();

  ventas
    .filter(function(datos) {
  const coincideBusqueda =
    (datos.nombre || "").toLowerCase().includes(busqueda) ||
    (datos.producto || "").toLowerCase().includes(busqueda);

  const coincideEstado =
    estado === "Todas" ||
    (datos.estado || "").toLowerCase().startsWith(
      estado.toLowerCase()
    );

  return coincideBusqueda && coincideEstado;
})
    .forEach(function(datos) {
      const venta = document.createElement("div");

      const estadoTexto =
        (datos.estado || "").trim().toLowerCase();

      const estadoNormalizado =
        estadoTexto.startsWith("paga")
          ? "Pagada"
          : estadoTexto.startsWith("pend")
          ? "Pendiente"
          : "Sin estado";

      venta.innerHTML =
        "<strong>" + datos.nombre + "</strong><br>" +
        "Producto: " + datos.producto + "<br>" +
        "Monto: $" + datos.monto + "<br>" +
        "Estado: " + estadoNormalizado;

      lista.appendChild(venta);
    });
  }
mostrarVentasGuardadas();
</script>
</body>
</html>
