<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Referidos | CRUSAA Network</title>
  <style>
form {
  background: #18263b;
  padding: 22px;
  border-radius: 24px;
}

input,
textarea,
select {
  width: 100%;
  padding: 16px;
  margin-bottom: 12px;
  border-radius: 12px;
  border: 1px solid #43536a;
  background: white;
  color: #111;
  font-size: 16px;
}

textarea {
  min-height: 100px;
  resize: vertical;
}

.permiso {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  color: #d5deea;
  margin: 8px 0 20px;
  line-height: 1.4;
}

.permiso input {
  width: auto;
  margin: 4px 0 0;
}

button {
  width: 100%;
  padding: 16px;
  border: none;
  border-radius: 12px;
  background: #1769e8;
  color: white;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #081426;
      color: white;
    }

    .contenedor {
      max-width: 700px;
      margin: auto;
      padding: 25px 20px;
    }

    h1 {
      margin-bottom: 5px;
      font-size: 36px;
    }

    .subtitulo {
      color: #aeb9ca;
      font-size: 18px;
      margin-bottom: 30px;
    }
    .tarjetaReferido {
  background: #18263b;
  padding: 18px;
  margin-bottom: 14px;
  border-radius: 16px;
  font-size: 18px;
  line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="contenedor">
    <div id="menuReferidos">
  <button type="button" onclick="abrirNuevoReferido()">
    ➕ Agregar nuevo referido
  </button>

  <button type="button" onclick="abrirBuscarReferidos()">
    🔍 Buscar referidos
  </button>
    </div>
    <div id="seccionNuevoReferido">
    <h1>👥 Agregar Referido</h1>

    <p class="subtitulo">
      Registra una nueva oportunidad en CRUSAA Network.
    </p>
    <form id="formReferido">
<div id="campoReferidoPor">
  <input
    type="text"
    id="referidoPor"
    placeholder="¿Quién lo refirió?"
    autocomplete="off"
  >
  <div id="resultadosClientes"></div>
</div>
  <input type="text" id="nombre" placeholder="Nombre del referido *" required>

  <input type="text" id="apellido" placeholder="Apellido">

  <input type="tel" id="telefono" placeholder="Teléfono *" required>

  <input type="email" id="email" placeholder="Correo electrónico">

  <input type="text" id="direccion" placeholder="Dirección">

  <input type="text" id="ciudad" placeholder="Ciudad">

  <input type="text" id="estado" placeholder="Estado">

  <input type="text" id="codigoPostal" placeholder="Código Postal">

  <input type="text" id="relacion" placeholder="Relación con el referido">

  <input type="text" id="horario" placeholder="Mejor horario para llamar">

  <textarea id="comentarios" placeholder="Comentarios"></textarea>

  

  <button type="submit">Guardar Referido</button>

    </form>

    </div>
      
  </div>
  <input type="text" id="buscarReferido" placeholder="🔎 Buscar referido...">

<div id="referidosDelCliente"></div>
<script>
  const campoReferidoPor =
  document.getElementById("referidoPor");

const resultadosClientes =
  document.getElementById("resultadosClientes");

let clienteReferidorSeleccionado = null;

campoReferidoPor.addEventListener("input", function () {
  const texto = this.value.trim().toLowerCase();

  resultadosClientes.innerHTML = "";
  clienteReferidorSeleccionado = null;

  if (!texto) return;

  const clientes =
    JSON.parse(localStorage.getItem("clientesCRUSAA")) || [];

  const coincidencias = clientes.filter(cliente => {
    const nombreCompleto =
      ((cliente.nombre || "") + " " + (cliente.apellido || ""))
        .trim()
        .toLowerCase();

    return nombreCompleto.includes(texto);
  });

  coincidencias.forEach(cliente => {
    const opcion = document.createElement("button");
    opcion.type = "button";

    opcion.textContent =
      ((cliente.nombre || "") + " " + (cliente.apellido || "")).trim();

    opcion.onclick = function () {
      clienteReferidorSeleccionado = cliente;

      campoReferidoPor.value =
        ((cliente.nombre || "") + " " + (cliente.apellido || "")).trim();

      resultadosClientes.innerHTML = "";
    };

    resultadosClientes.appendChild(opcion);
  });
});
document.getElementById("formReferido").addEventListener("submit", function(event) {
  event.preventDefault();
const nombreReferidor = campoReferidoPor.value.trim();

if (
  nombreReferidor &&
  !clienteReferidorSeleccionado
) {
  const agregarComoCliente = confirm(
    '"' + nombreReferidor +
    '" no está seleccionado como cliente.\n\n' +
    '¿Quieres agregarlo como nuevo cliente?'
  );

  if (agregarComoCliente) {
    const partesNombre = nombreReferidor.split(" ");
    const nombreNuevo = partesNombre.shift() || "";
    const apellidoNuevo = partesNombre.join(" ");

    const clientes =
      JSON.parse(
        localStorage.getItem("clientesCRUSAA")
      ) || [];

    const nuevoCliente = {
      nombre: nombreNuevo,
      apellido: apellidoNuevo,
      telefono: "",
      email: "",
      notas: "",
      foto: ""
    };

    clientes.push(nuevoCliente);

    localStorage.setItem(
      "clientesCRUSAA",
      JSON.stringify(clientes)
    );

    clienteReferidorSeleccionado = nuevoCliente;
  }
}
  const referido = {
    nombre: document.getElementById("nombre").value.trim(),
    apellido: document.getElementById("apellido").value.trim(),
    telefono: document.getElementById("telefono").value.trim(),
    email: document.getElementById("email").value.trim(),
    direccion: document.getElementById("direccion").value.trim(),
    ciudad: document.getElementById("ciudad").value.trim(),
    estado: document.getElementById("estado").value.trim(),
    codigoPostal: document.getElementById("codigoPostal").value.trim(),
    relacion: document.getElementById("relacion").value.trim(),
    horario: document.getElementById("horario").value.trim(),
    comentarios: document.getElementById("comentarios").value.trim(),
    fecha: new Date().toISOString(),
  
clienteOrigen:
  clienteReferidorSeleccionado
    ? (
        (clienteReferidorSeleccionado.nombre || "") +
        " " +
        (clienteReferidorSeleccionado.apellido || "")
      ).trim()
    : campoReferidoPor.value.trim()
  };

  let referidos =
    JSON.parse(localStorage.getItem("referidosCRUSAA")) || [];

  referidos.push(referido);

  localStorage.setItem(
    "referidosCRUSAA",
    JSON.stringify(referidos)
  );

  alert("Referido guardado correctamente.");

  document.getElementById("formReferido").reset();
  mostrarReferidosDelCliente();
});
  function mostrarReferidosDelCliente() {
  const contenedor =
    document.getElementById("referidosDelCliente");

  const clienteActual = JSON.parse(
    localStorage.getItem("clienteReferidosActual")
  );

  if (!clienteActual) {
    contenedor.innerHTML = "";
    return;
  }

  const referidos = JSON.parse(
    localStorage.getItem("referidosCRUSAA")
  ) || [];

  const busqueda =
  document.getElementById("buscarReferido")
    .value.trim().toLowerCase();

const delCliente = referidos.filter(referido => {
  const esDelCliente =
    referido.clienteOrigen === clienteActual.nombre;

  const coincideBusqueda =
    !busqueda ||
    (referido.nombre || "").toLowerCase().includes(busqueda) ||
    (referido.apellido || "").toLowerCase().includes(busqueda) ||
    (referido.telefono || "").toLowerCase().includes(busqueda) ||
    (referido.email || "").toLowerCase().includes(busqueda);

  return esDelCliente && coincideBusqueda;
});
  contenedor.innerHTML =
    "<h2>👥 Referidos de " + clienteActual.nombre + "</h2>";

  if (delCliente.length === 0) {
    contenedor.innerHTML +=
      "<p>Este cliente todavía no tiene referidos.</p>";
    return;
  }

  delCliente.forEach((referido, index) => {
  contenedor.innerHTML +=
    '<div class="tarjetaReferido">' +
    '<strong>👤 ' + referido.nombre + ' ' +
    referido.apellido + '</strong><br>' +
'📞 ' + referido.telefono + '<br>' +
'✉️ ' + (referido.email || '') + '<br><br>' +
    '<button onclick="editarReferido(\'' + referido.telefono + '\')">✏️ Editar</button>' +
'<br><br>' +
    '<button onclick="eliminarReferido(\'' + referido.telefono + '\')">🗑️ Eliminar</button>' +
    '</div>';
});
}
function eliminarReferido(telefono) {
  if (!confirm("¿Eliminar este referido?")) {
    return;
  }

  let referidos =
    JSON.parse(localStorage.getItem("referidosCRUSAA")) || [];

  referidos = referidos.filter(
    referido => referido.telefono !== telefono
  );

  localStorage.setItem(
    "referidosCRUSAA",
    JSON.stringify(referidos)
  );

  mostrarReferidosDelCliente();
}
  document
  .getElementById("buscarReferido")
  .addEventListener("input", function () {
    mostrarReferidosDelCliente();
  });
  function editarReferido(telefonoOriginal) {
  let referidos =
    JSON.parse(localStorage.getItem("referidosCRUSAA")) || [];

  const index = referidos.findIndex(
    referido => referido.telefono === telefonoOriginal
  );

  if (index === -1) return;

  const referido = referidos[index];

  const nombre = prompt("Nombre:", referido.nombre);
  if (nombre === null) return;

  const apellido = prompt("Apellido:", referido.apellido || "");
  if (apellido === null) return;

  const telefono = prompt("Teléfono:", referido.telefono);
  if (telefono === null) return;
const email = prompt("Correo electrónico:",
referido.email || "");
if (email === null) return;
  referido.nombre = nombre;
  referido.apellido = apellido;
  referido.telefono = telefono;
referido.email = email;
  localStorage.setItem(
    "referidosCRUSAA",
    JSON.stringify(referidos)
  );

  mostrarReferidosDelCliente();
  }
  function abrirNuevoReferido() {
  document.getElementById("menuReferidos").style.display = "none";
  document.getElementById("seccionNuevoReferido").style.display = "block";
  }
  const clienteDesdeClientes = JSON.parse(
  localStorage.getItem("clienteReferidosActual")
);

if (clienteDesdeClientes) {
  document.getElementById("menuReferidos").style.display = "none";
  document.getElementById("seccionNuevoReferido").style.display = "block";
} else {
  document.getElementById("menuReferidos").style.display = "block";
  document.getElementById("seccionNuevoReferido").style.display = "none";
}
mostrarReferidosDelCliente();
</script>
</body>
</html>
