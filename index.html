<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRUSAA Network CRM</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login {
      width: 100%;
      max-width: 400px;
      background: #1e293b;
      padding: 32px 24px;
      border-radius: 18px;
      box-shadow: 0 15px 40px rgba(0,0,0,.35);
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 9px;
      border: 1px solid #475569;
      background: #0f172a;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #16a34a;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #mensaje {
      text-align: center;
      margin-top: 15px;
      color: #f87171;
    }
 .logo-crusaa {
  width: 100%;
  max-width: 320px;
  display: block;
  margin: 0 auto 20px;
  border-radius: 16px;
 } </style>
</head>

<body>

  <div class="login">
    <img src="file_00000000954881f9b21a69bda95ae034~2.jpg" class="logo-crusaa" alt="CRUSAA Network">
    <h1>CRUSAA Network</h1>
    <div class="subtitle">CRM</div>

    <form id="loginForm">

      <label for="email">Correo electrónico</label>
      <input
        type="email"
        id="email"
        placeholder="correo@ejemplo.com"
        required
      >

      <label for="password">Contraseña</label>
      <input
        type="password"
        id="password"
        placeholder="Contraseña"
        required
      >

      <button type="submit">
        Iniciar sesión
      </button>

      <div id="mensaje"></div>

    </form>
  </div>
<script src="app.js"></script>
</body>
</html>
