<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRUSAA Network CRM</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      background:
        radial-gradient(circle at top, #123d69 0%, #061a31 45%, #020b17 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px 14px;
    }

    .login {
      width: 100%;
      max-width: 430px;
      text-align: center;
    }

    .logo-crusaa {
      width: 100%;
      max-width: 300px;
      display: block;
      margin: 0 auto 10px;
      border-radius: 24px;
      border: 1px solid rgba(255, 205, 84, 0.55);
      box-shadow:
        0 0 25px rgba(0, 153, 255, 0.25),
        0 0 12px rgba(255, 190, 55, 0.18);
    }

    .titulo {
      margin: 0;
      font-size: 38px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .network {
      color: #e8b94f;
    }

    .lema {
      margin: 6px 0 14px;
      color: #c7d3e2;
      font-size: 15px;
      letter-spacing: 2px;
    }

    .panel {
      padding: 20px 18px;
      border: 1px solid #d7ad4c;
      border-radius: 28px;
      background: rgba(5, 27, 51, 0.88);
      box-shadow:
        0 0 25px rgba(0, 157, 255, 0.18),
        inset 0 0 20px rgba(255, 196, 63, 0.04);
    }

    .panel h2 {
      margin: 0 0 8px;
      font-size: 31px;
    }

    .subtitulo {
      margin-bottom: 25px;
      color: #aebdce;
      font-size: 16px;
    }

    label {
      display: block;
      text-align: left;
      margin: 15px 0 7px;
      color: #e8edf4;
    }

    input {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: 1px solid #526a83;
      background: #07182d;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #e7b84c;
      box-shadow: 0 0 8px rgba(231, 184, 76, 0.35);
    }

    input::placeholder {
      color: #7f8fa3;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 16px;
      border: 1px solid #ffe08a;
      border-radius: 30px;
      background: linear-gradient(
        180deg,
        #ffe291 0%,
        #d99a27 52%,
        #f5c75e 100%
      );
      color: #081322;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 18px rgba(238, 180, 50, 0.35);
    }

    #mensaje {
      text-align: center;
      margin-top: 15px;
      color: #ff8b8b;
    }

    .pie {
      display: flex;
      justify-content: space-around;
      gap: 8px;
      margin-top: 27px;
      color: #e7bb58;
      font-size: 12px;
      letter-spacing: 1px;
    }

    .pie div {
      flex: 1;
    }

    .icono {
      display: block;
      font-size: 25px;
      margin-bottom: 6px;
    }

    @media (max-width: 480px) {
      .titulo {
        font-size: 31px;
      }

      .panel {
        padding: 25px 18px;
      }

      .logo-crusaa {
        max-width: 330px;
      }
    }
  </style>
</head>

<body>

  <div class="login">

    <img
      src="file_00000000954881f9b21a69bda95ae034~2.jpg"
      class="logo-crusaa"
      alt="CRUSAA Network"
    >

    <h1 class="titulo">
      CRUSAA <span class="network">NETWORK</span>
    </h1>

    <div class="lema">
      SOLUCIONES PARA UNA MEJOR CALIDAD DE VIDA
    </div>

    <div class="panel">

      <h2>Bienvenido</h2>

      <div class="subtitulo">
        Inicia sesión para acceder a tu CRM
      </div>

      <form id="loginForm">

        <label for="email">Correo electrónico</label>
        <input
          type="email"
          id="email"
          placeholder="Correo electrónico"
          required
        >

        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          placeholder="Contraseña"
          required
        >

        <button type="submit">
          ↪ Iniciar sesión
        </button>

        <div id="mensaje"></div>

      </form>

    </div>

    <div class="pie">
      <div>
        <span class="icono">♟</span>
        DISCIPLINA
      </div>

      <div>
        <span class="icono">▥</span>
        RESULTADOS
      </div>

      <div>
        <span class="icono">★</span>
        UN MEJOR MAÑANA
      </div>
    </div>

  </div>

  <script src="app.js"></script>

</body>
</html>
