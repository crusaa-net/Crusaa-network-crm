<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Detalle del Cliente - CRUSAA Network</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #071426;
      color: white;
      font-family: Arial, sans-serif;
    }

    .contenedor {
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    .encabezado {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 25px;
    }

    .volver {
      background: transparent;
      border: none;
      color: white;
      font-size: 28px;
      cursor: pointer;
    }

    .titulo {
      font-size: 24px;
      font-weight: bold;
    }

    .editar {
      color: #35a7ff;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="contenedor">

    <div class="encabezado">
      <button class="volver"
        onclick="window.location.href='clientes.html'">
        ←
      </button>

      <div class="titulo">Detalle del Cliente</div>

<div class="editar" id="editarCliente">Editar</div>
    </div>
    <div class="perfil">
  <div id="fotoCliente"></div>

  <h2 id="nombreCliente">Cliente</h2>

  <div class="acciones">
    <a id="llamarCliente">📞 Llamar</a>
    <a id="whatsappCliente">💬 WhatsApp</a>
    <a id="correoCliente">✉️ Correo</a>
  </div>

  <div class="datos">
    <p id="telefonoCliente">📞</p>
    <p id="emailCliente">✉️</p>
    <p id="direccionCliente">📍 Dirección</p>

    <button id="mapsCliente">
      🗺️ Ver en Google Maps
    </button>
  </div>

  <div class="notas">
    <h3>Notas</h3>
    <p id="notasCliente"></p>
  </div>

  <div class="seguimiento">
    <h3>Próximo seguimiento</h3>
    <input type="datetime-local" id="fechaSeguimiento">

    <button id="calendarCliente">
      📅 Agregar a Google Calendar
    </button>
  </div>
      <div class="seguimiento">
  <h3>Historial de seguimientos</h3>
  <div id="historialSeguimientos">
    No hay seguimientos registrados.
  </div>
      </div>
    </div>
    </div>

<script>
  const cliente = JSON.parse(
  localStorage.getItem("clienteActual")
);

if (!cliente) {
  alert("No se encontró el cliente seleccionado.");
  window.location.href = "clientes.html";
} else {
  // MOSTRAR HISTORIAL DE SEGUIMIENTOS
const historial = document.getElementById(
  "historialSeguimientos"
);

if (
  Array.isArray(cliente.seguimientos) &&
  cliente.seguimientos.length > 0
) {
  historial.innerHTML = "";

  cliente.seguimientos.forEach((seguimiento) => {
    const registro = document.createElement("div");

    const fecha = new Date(seguimiento.fecha);

    registro.textContent =
      "📅 " +
      (seguimiento.tipo || "Seguimiento") +
      " - " +
      (isNaN(fecha.getTime())
        ? seguimiento.fecha
        : fecha.toLocaleString("es-US"));

    registro.style.padding = "10px";
    registro.style.marginBottom = "8px";
    registro.style.borderBottom = "1px solid #ccc";

    historial.appendChild(registro);
    
const botones = document.createElement("div");
botones.style.marginTop = "8px";

const completar = document.createElement("button");
completar.textContent = seguimiento.completado
  ? "↩️ Pendiente"
  : "✅ Completar";

completar.onclick = function () {
  seguimiento.completado = !seguimiento.completado;
  guardarSeguimientos();
};

const editar = document.createElement("button");
editar.textContent = "✏️ Editar";

editar.onclick = function () {
  const nuevaFecha = prompt(
    "Nueva fecha y hora (AAAA-MM-DDTHH:MM):",
    seguimiento.fecha
  );

  if (nuevaFecha === null) return;

  const fechaValida = new Date(nuevaFecha);
  if (!nuevaFecha.trim() || isNaN(fechaValida.getTime())) {
    alert("Fecha inválida.");
    return;
  }

  seguimiento.fecha = nuevaFecha;
  guardarSeguimientos();
};

const eliminar = document.createElement("button");
eliminar.textContent = "🗑️ Eliminar";

eliminar.onclick = function () {
  if (!confirm("¿Eliminar este seguimiento?")) return;

  const indice = cliente.seguimientos.indexOf(seguimiento);
  if (indice !== -1) {
    cliente.seguimientos.splice(indice, 1);
    guardarSeguimientos();
  }
};

botones.append(completar, editar, eliminar);
registro.appendChild(botones);

  });
}
  
function guardarSeguimientos() {
  const clientes = JSON.parse(
    localStorage.getItem("clientesCRUSAA") || "[]"
  );

  const indice = clientes.findIndex(c =>
    c.nombre === cliente.nombre &&
    c.telefono === cliente.telefono
  );

  if (indice !== -1) {
    clientes[indice] = cliente;

    localStorage.setItem(
      "clientesCRUSAA",
      JSON.stringify(clientes)
    );
  } else {
    alert("No se encontró el cliente para guardar.");
    return;
  }

  localStorage.setItem(
    "clienteActual",
    JSON.stringify(cliente)
  );

  location.reload();
}
document.getElementById("nombreCliente").textContent =
    cliente.nombre || "Cliente";

  document.getElementById("telefonoCliente").textContent =
    "📞 " + (cliente.telefono || "");

  document.getElementById("emailCliente").textContent =
    "✉️ " + (cliente.email || "");

  document.getElementById("notasCliente").textContent =
    cliente.notas || "Sin notas";
}
  if (cliente) {
  const telefono = cliente.telefono || "";
  const email = cliente.email || "";

  document.getElementById("llamarCliente").href =
    "tel:" + telefono;

  document.getElementById("whatsappCliente").href =
    "https://wa.me/" + telefono.replace(/\D/g, "");

  document.getElementById("correoCliente").href =
    "mailto:" + email;
  }
  if (cliente) {
  const direccion = cliente.direccion || "";

  document.getElementById("direccionCliente").textContent =
    "📍 " + (direccion || "Sin dirección");

  document.getElementById("mapsCliente").onclick = function () {
    if (!direccion) {
      alert("Este cliente todavía no tiene una dirección.");
      return;
    }

    window.open(
      "https://www.google.com/maps/search/?api=1&query=" +
      encodeURIComponent(direccion),
      "_blank"
    );
  };
  }
  if (cliente) {
  document.getElementById("calendarCliente").onclick = function () {
    const fecha = document.getElementById("fechaSeguimiento").value;

    if (!fecha) {
      alert("Selecciona primero la fecha y hora de la cita.");
      return;
    }

    const inicio = new Date(fecha);
    const fin = new Date(inicio.getTime() + 60 * 60 * 1000);

    function formatoGoogle(fecha) {
      return fecha.toISOString()
        .replace(/[-:]/g, "")
        .replace(/\.\d{3}/, "");
    }

    const titulo =
      "Cita con " + (cliente.nombre || "Cliente");

    const detalles =
  "Teléfono: " + (cliente.telefono || "") +
  "\nCorreo: " + (cliente.email || "") +
  "\n\nNotas: " + (cliente.notas || "Sin notas");
    const url =
      "https://calendar.google.com/calendar/render?action=TEMPLATE" +
      "&text=" + encodeURIComponent(titulo) +
      "&dates=" + formatoGoogle(inicio) + "/" + formatoGoogle(fin) +
      "&details=" + encodeURIComponent(detalles) +
      "&location=" + encodeURIComponent(cliente.direccion || "");
// Guardar seguimiento en el cliente
if (!Array.isArray(cliente.seguimientos)) {
  cliente.seguimientos = [];
}

cliente.seguimientos.push({
  fecha: fecha,
  tipo: "Cita",
  creado: new Date().toISOString()
});

const clientesGuardados =
  JSON.parse(localStorage.getItem("clientesCRUSAA")) || [];

const indiceCliente = clientesGuardados.findIndex(c =>
  c.nombre === cliente.nombre ||
  (c.telefono && c.telefono === cliente.telefono)
);

if (indiceCliente !== -1) {
  clientesGuardados[indiceCliente] = cliente;

  localStorage.setItem(
    "clientesCRUSAA",
    JSON.stringify(clientesGuardados)
  );
}

localStorage.setItem(
  "clienteActual",
  JSON.stringify(cliente)
);
    window.open(url, "_blank");
  };
  }
  document.getElementById("editarCliente").onclick = function () {
  const nombre = prompt("Nombre del cliente:", cliente.nombre);
  if (nombre === null) return;

  const telefono = prompt("Teléfono:", cliente.telefono || "");
  if (telefono === null) return;

  const email = prompt("Correo electrónico:", cliente.email || "");
  if (email === null) return;

  const direccion = prompt("Dirección:", cliente.direccion || "");
  if (direccion === null) return;

  const notas = prompt("Notas:", cliente.notas || "");
  if (notas === null) return;
   
    const nombreOriginal = cliente.nombre;
const telefonoOriginal = cliente.telefono;
    cliente.nombre = nombre;
cliente.telefono = telefono;
cliente.email = email;
cliente.direccion = direccion;
cliente.notas = notas;

const clientes = JSON.parse(
  localStorage.getItem("clientesCRUSAA")
) || [];
const index = clientes.findIndex(c =>
  c.nombre === nombreOriginal ||
  (c.telefono && c.telefono === telefonoOriginal)
);
if (index !== -1) {
  clientes[index] = cliente;

  localStorage.setItem(
    "clientesCRUSAA",
    JSON.stringify(clientes)
  );
}

localStorage.setItem(
  "clienteActual",
  JSON.stringify(cliente)
);
    document.getElementById("nombreCliente").textContent =
  cliente.nombre;

document.getElementById("telefonoCliente").textContent =
  "📞 " + (cliente.telefono || "");

document.getElementById("emailCliente").textContent =
  "✉️ " + (cliente.email || "");

document.getElementById("direccionCliente").textContent =
  "📍 " + (cliente.direccion || "Sin dirección");

document.getElementById("notasCliente").textContent =
  cliente.notas || "Sin notas";
    
};
  let esperandoRegresoCalendario = false;

document.getElementById("calendarioCliente")
    .addEventListener("click", function() {
        esperandoRegresoCalendario = true;
    });

window.addEventListener("focus", function() {
    if (esperandoRegresoCalendario) {
        esperandoRegresoCalendario = false;
        location.reload();
    }
});
  </script>

</body>
</html>
