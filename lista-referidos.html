<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Referidos | CRUSAA Network</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #081426;
      color: white;
    }

    .contenedor {
      max-width: 700px;
      margin: auto;
      padding: 25px 20px;
    }

    h1 {
      margin-bottom: 5px;
      font-size: 36px;
    }

    .subtitulo {
      color: #aeb9ca;
      font-size: 18px;
      margin-bottom: 25px;
    }

    .acciones {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }

    .nuevo {
      display: block;
      width: 100%;
      padding: 15px;
      text-align: center;
      text-decoration: none;
      background: #1769e8;
      color: white;
      border-radius: 12px;
      font-weight: bold;
      font-size: 17px;
    }

    .tarjeta {
      background: #18263b;
      padding: 22px;
      border-radius: 24px;
      margin-bottom: 18px;
    }

    .nombre {
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .dato {
      color: #d7deea;
      font-size: 17px;
      margin: 8px 0;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .fecha {
      color: #8998ad;
      font-size: 14px;
      margin-top: 15px;
    }

    .vacio {
      background: #18263b;
      padding: 30px 20px;
      border-radius: 24px;
      text-align: center;
      color: #aeb9ca;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <div class="contenedor">

    <h1>👥 Mis Referidos</h1>

    <p class="subtitulo">
      Personas referidas a CRUSAA Network.
    </p>

    <div class="acciones">
      <a class="nuevo" href="referidos.html">
        + Agregar Referido
      </a>
    </div>

    <div id="listaReferidos"></div>

  </div>

  <script>

    function mostrarReferidos() {

      const lista =
        document.getElementById("listaReferidos");

      const referidos =
        JSON.parse(
          localStorage.getItem("referidosCRUSAA")
        ) || [];

      if (referidos.length === 0) {

        lista.innerHTML =
          '<div class="vacio">' +
          'Todavía no tienes referidos registrados.' +
          '</div>';

        return;
      }

      lista.innerHTML = "";

      referidos.forEach((referido) => {

        const tarjeta =
          document.createElement("div");

        tarjeta.className = "tarjeta";


        const nombre =
          document.createElement("div");

        nombre.className = "nombre";

        nombre.textContent =
          (referido.nombre || "") +
          " " +
          (referido.apellido || "");

        tarjeta.appendChild(nombre);


        if (referido.telefono) {

          const dato =
            document.createElement("div");

          dato.className = "dato";
          dato.textContent =
            "📞 " + referido.telefono;

          tarjeta.appendChild(dato);
        }


        if (referido.email) {

          const dato =
            document.createElement("div");

          dato.className = "dato";
          dato.textContent =
            "✉️ " + referido.email;

          tarjeta.appendChild(dato);
        }


        if (referido.direccion) {

          const dato =
            document.createElement("div");

          dato.className = "dato";
          dato.textContent =
            "📍 " + referido.direccion;

          tarjeta.appendChild(dato);
        }


        if (
          referido.ciudad ||
          referido.estado ||
          referido.codigoPostal
        ) {

          const dato =
            document.createElement("div");

          dato.className = "dato";

          dato.textContent =
            "🏙️ " +
            [
              referido.ciudad,
              referido.estado,
              referido.codigoPostal
            ]
            .filter(Boolean)
            .join(", ");

          tarjeta.appendChild(dato);
        }


        if (referido.relacion) {

          const dato =
            document.createElement("div");

          dato.className = "dato";
          dato.textContent =
            "👥 Relación: " +
            referido.relacion;

          tarjeta.appendChild(dato);
        }


        if (referido.horario) {

          const dato =
            document.createElement("div");

          dato.className = "dato";
          dato.textContent =
            "🕐 Mejor horario: " +
            referido.horario;

          tarjeta.appendChild(dato);
        }


        if (referido.comentarios) {

          const dato =
            document.createElement("div");

          dato.className = "dato";
          dato.textContent =
            "📝 " + referido.comentarios;

          tarjeta.appendChild(dato);
        }


        if (referido.fecha) {

          const fecha =
            document.createElement("div");

          fecha.className = "fecha";

          fecha.textContent =
            "Registrado: " +
            new Date(
              referido.fecha
            ).toLocaleString();

          tarjeta.appendChild(fecha);
        }


        lista.appendChild(tarjeta);

      });

    }


    mostrarReferidos();

  </script>

</body>
</html>
