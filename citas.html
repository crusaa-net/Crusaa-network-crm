<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Citas - CRUSAA Network</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    header {
      background: #1e293b;
      padding: 20px;
    }

    header h2 {
      margin: 0;
    }

    main {
      padding: 30px;
      max-width: 700px;
      margin: auto;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitulo {
      color: #94a3b8;
      margin-bottom: 25px;
    }

    .formulario {
      background: #1e293b;
      padding: 20px;
      border-radius: 18px;
      margin-bottom: 25px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid #475569;
      border-radius: 10px;
      background: #0f172a;
      color: white;
      font-size: 16px;
    }

    button {
      padding: 14px 18px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    .guardar {
      width: 100%;
      background: #2563eb;
      color: white;
      font-weight: bold;
    }

    .cita {
      background: #1e293b;
      padding: 18px;
      border-radius: 15px;
      margin-bottom: 15px;
    }

    .cita h3 {
      margin-top: 0;
    }

    .eliminar {
      background: #ef4444;
      color: white;
      margin-top: 8px;
    }

    .vacio {
      color: #94a3b8;
      text-align: center;
      padding: 25px;
    }

    .volver {
      color: white;
      text-decoration: none;
    }.editar {
  background: #2f6fed;
  color: white;
  border: none;
  padding: 12px 18px;
  border-radius: 10px;
  font-size: 16px;
  margin-right: 8px;
  cursor: pointer;
    }
  </style>
</head>

<body>

<header>
  <a class="volver" href="crm.html">← Volver al CRM</a>
</header>

<main>

  <h1>📅 Citas</h1>
  <p class="subtitulo">
    Organiza citas, demostraciones y seguimientos.
  </p>

  <div class="formulario">

    <input
      type="text"
      id="cliente"
      placeholder="Nombre del cliente"
    >
<label for="fecha">📅 Fecha de la cita</label>
    <input
      type="date"
      id="fecha"
    >
<label for="hora">🕐 Hora de la cita</label>
    <input
      type="time"
      id="hora"
    >

    <select id="tipo">
      <option value="">Tipo de cita</option>
      <option value="Demostración">Demostración</option>
      <option value="Seguimiento">Seguimiento</option>
      <option value="Entrega">Entrega</option>
      <option value="Otro">Otro</option>
    </select>

    <textarea
      id="notas"
      placeholder="Notas de la cita"
    ></textarea>

    <button class="guardar" onclick="guardarCita()">
  + Guardar cita
</button>

</div>

<div id="listaCitas"></div>

</main>

<script>

let citas =
  JSON.parse(localStorage.getItem("citasCRUSAA")) || [];

function guardarCita() {

  const cliente =
    document.getElementById("cliente").value.trim();

  const fecha =
    document.getElementById("fecha").value;

  const hora =
    document.getElementById("hora").value;

  const tipo =
    document.getElementById("tipo").value;

  const notas =
    document.getElementById("notas").value.trim();

  if (!cliente || !fecha || !hora) {
    alert("Ingresa cliente, fecha y hora.");
    return;
  }

  citas.push({
    cliente,
    fecha,
    hora,
    tipo,
    notas
  });

  localStorage.setItem(
    "citasCRUSAA",
    JSON.stringify(citas)
  );

  document.getElementById("cliente").value = "";
  document.getElementById("fecha").value = "";
  document.getElementById("hora").value = "";
  document.getElementById("tipo").value = "";
  document.getElementById("notas").value = "";

  mostrarCitas();
}

function eliminarCita(index) {

  if (!confirm("¿Eliminar esta cita?")) {
    return;
  }

  citas.splice(index, 1);

  localStorage.setItem(
    "citasCRUSAA",
    JSON.stringify(citas)
  );

  mostrarCitas();
}

function mostrarCitas() {

  const lista =
    document.getElementById("listaCitas");

  if (citas.length === 0) {
    lista.innerHTML =
      '<div class="vacio">Todavía no hay citas registradas.</div>';
    return;
  }

  lista.innerHTML = "";

  citas.forEach((cita, index) => {

    const tarjeta =
      document.createElement("div");

    tarjeta.className = "cita";

    const titulo =
      document.createElement("h3");

    titulo.textContent = cita.cliente;
    tarjeta.appendChild(titulo);

    const fecha =
      document.createElement("p");

    fecha.textContent =
      "📅 " + cita.fecha + "  🕐 " + cita.hora;

    tarjeta.appendChild(fecha);

    if (cita.tipo) {
      const tipo = document.createElement("p");
      tipo.textContent = "📌 " + cita.tipo;
      tarjeta.appendChild(tipo);
    }

    if (cita.notas) {
      const notas = document.createElement("p");
      notas.textContent = "📝 " + cita.notas;
      tarjeta.appendChild(notas);
    }
const editar = document.createElement("button");
editar.textContent = "✏️ Editar";
editar.className = "editar";
editar.onclick = function () {
  editarCita(index);
};

tarjeta.appendChild(editar);
    const eliminar =
      document.createElement("button");

    eliminar.className = "eliminar";
    eliminar.textContent = "Eliminar";

    eliminar.onclick = function () {
      eliminarCita(index);
    };

    tarjeta.appendChild(eliminar);
    lista.appendChild(tarjeta);
  });
}function editarCita(index) {
  const cita = citas[index];

  const cliente = prompt("Nombre del cliente:", cita.cliente);
  if (cliente === null) return;

  const fecha = prompt("Fecha:", cita.fecha);
  if (fecha === null) return;

  const hora = prompt("Hora:", cita.hora);
  if (hora === null) return;

  const tipo = prompt("Tipo de cita:", cita.tipo);
  if (tipo === null) return;

  const notas = prompt("Notas:", cita.notas || "");
  if (notas === null) return;

  citas[index] = {
    cliente: cliente,
    fecha: fecha,
    hora: hora,
    tipo: tipo,
    notas: notas
  };

  localStorage.setItem(
    "citasCRUSAA",
    JSON.stringify(citas)
  );

  mostrarCitas();
}

mostrarCitas();

</script>

</body>
</html>
